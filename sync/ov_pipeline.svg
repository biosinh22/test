<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 728" width="760" height="728" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="13">
<rect width="760" height="728" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a89e"/></marker></defs>
<text x="24" y="32" font-size="15" font-weight="600" fill="#1f1f1f">Cell line안에서 같은 passage끼리 비교해 3D에서 유지되는 결과 확인</text>
<text x="24" y="52" font-size="11.5" fill="#6b6b6b">RNA-seq analysis pipelien · 32 samples (cell line 4종 먼저)</text>
<g><rect x="24" y="68" width="712" height="34" rx="8" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5" fill-opacity="0.1"/><text x="40" y="90" font-size="12" fill="#1f1f1f">비교는 cell line 안에서, 같은 passage끼리 비교 → batch(1차/2차)·cell line 겹침과 passage 차이를 함께 피할 수 있도록</text></g>
