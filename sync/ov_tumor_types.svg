<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="13">
<rect width="760" height="500" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a89e"/></marker></defs>
<text x="24" y="32" font-size="15" font-weight="600" fill="#1f1f1f">Ovarian cancer 분류</text>
<g><rect x="24" y="72" width="440" height="372" rx="8" fill="#f1f0ea" stroke="#a8a89e" stroke-width="1.25"/><text x="40" y="98" font-size="14" font-weight="600" fill="#1f1f1f">Epithelial · 약 90%</text></g>
<g><rect x="40" y="116" width="176" height="112" rx="8" fill="none" stroke="#a8a89e" stroke-width="1.25"/><text x="128" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Serous</text><text x="128" y="177" text-anchor="middle" font-size="11.5" fill="#6b6b6b">70–80%</text><text x="128" y="193" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b6b6b">SKOV-3 (SOC)</text></g>
<g><rect x="232" y="116" width="216" height="52" rx="8" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="2" fill-opacity="0.12"/><text x="340" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">High-grade (HGSOC)</text><text x="340" y="155" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b6b6b">OVCAR-3 · OVSAHO · HeyA8</text></g>
<g><rect x="232" y="176" width="216" height="52" rx="8" fill="none" stroke="#a8a89e" stroke-width="1.25"/><text x="340" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Low-grade (LGSOC)</text><text x="340" y="215" text-anchor="middle" font-size="11.5" fill="#6b6b6b">HOC-7, MPSC1</text></g>
<g><rect x="40" y="244" width="408" height="52" rx="8" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="2" fill-opacity="0.12"/><text x="244" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Endometrioid · 약 10%</text><text x="244" y="283" text-anchor="middle" font-size="11.5" fill="#6b6b6b"><tspan font-weight="600">A2780</tspan>, TOV-112D, COV434</text></g>
<g><rect x="40" y="308" width="408" height="52" rx="8" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="2" fill-opacity="0.12"/><text x="244" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Clear cell · 약 10%</text><text x="244" y="347" text-anchor="middle" font-size="11.5" fill="#6b6b6b"><tspan font-weight="600">OVTOKO · RMG-I · RMG-II</tspan>, TOV-21G</text></g>
<g><rect x="40" y="372" width="408" height="52" rx="8" fill="none" stroke="#a8a89e" stroke-width="1.25"/><text x="244" y="394" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Mucinous · 약 3%</text><text x="244" y="411" text-anchor="middle" font-size="11.5" fill="#6b6b6b">MCAS, RMUG-S</text></g>
<g><path d="M216 172H224V142H232" fill="none" stroke="#a8a89e" stroke-width="1.25" marker-end="url(#a)"/><path d="M216 172H224V202H232" fill="none" stroke="#a8a89e" stroke-width="1.25" marker-end="url(#a)"/></g>
<g><rect x="480" y="72" width="256" height="52" rx="8" fill="none" stroke="#a8a89e" stroke-width="1.25"/><text x="608" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Sex cord-stromal · 약 7%</text></g>
<g><rect x="480" y="140" width="256" height="236" rx="8" fill="#f1f0ea" stroke="#a8a89e" stroke-width="1.25"/><text x="496" y="166" font-size="14" font-weight="600" fill="#1f1f1f">Germ cell · 3–7%</text><rect x="496" y="180" width="224" height="40" rx="8" fill="none" stroke="#a8a89e" stroke-width="1.25"/><text x="608" y="204" text-anchor="middle" font-size="13" fill="#1f1f1f">Mature teratoma · 양성</text><rect x="496" y="228" width="224" height="40" rx="8" fill="none" stroke="#a8a89e" stroke-width="1.25"/><text x="608" y="252" text-anchor="middle" font-size="13" fill="#1f1f1f">Immature teratoma · 악성</text><rect x="496" y="276" width="224" height="40" rx="8" fill="none" stroke="#a8a89e" stroke-width="1.25"/><text x="608" y="300" text-anchor="middle" font-size="13" fill="#1f1f1f">Dysgerminoma · 악성</text><rect x="496" y="324" width="224" height="40" rx="8" fill="none" stroke="#a8a89e" stroke-width="1.25"/><text x="608" y="348" text-anchor="middle" font-size="13" fill="#1f1f1f">Yolk sac tumor · 악성</text></g>
<g><rect x="480" y="392" width="256" height="52" rx="8" fill="none" stroke="#a8a89e" stroke-width="1.25"/><text x="608" y="414" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Other rare</text><text x="608" y="431" text-anchor="middle" font-size="11.5" fill="#6b6b6b">기타 희귀 종양</text></g>
<g><rect x="24" y="464" width="16" height="16" rx="4" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="2" fill-opacity="0.12"/><text x="48" y="477" font-size="11.5" fill="#6b6b6b">본 프로젝트에서 다루는 cell line이 속한 Subtype (DepMap 기준)</text></g>
</svg>
